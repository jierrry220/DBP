<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="js/disable-console.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameFi - Debear Party</title>
    <style>
        /* ========== Global Styles ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #00c4ef 0%, #e900e9 100%);
            --secondary-gradient: linear-gradient(135deg, #4dd0e1 0%, #d91e5a 100%);
            --neon-cyan: #00c4ef;
            --neon-pink: #e900e9;
            --neon-magenta: #d91e5a;
            --dark-bg: #0a0e1a;
            --dark-surface: #1a0a2e;
            --dark-purple: #2d1b4e;
            --text-primary: #ffffff;
            --text-secondary: #a0b1d4;
            --grid-color: rgba(0, 196, 239, 0.12);
            
            /* z-index layering system */
            --z-background: -1;
            --z-content: 1;
            --z-navbar: 100;
            --z-mobile-menu-overlay: 110;
            --z-mobile-menu: 120;
            --z-hamburger: 130;
            --z-toast: 200;
            --z-modal: 300;
            
            /* Spacing system */
            --spacing-xs: 8px;
            --spacing-sm: 16px;
            --spacing-md: 24px;
            --spacing-lg: 32px;
            --spacing-xl: 40px;
            --spacing-2xl: 48px;
            --spacing-3xl: 64px;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
            background: var(--dark-bg);
            color: var(--text-primary);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* ========== Particle Background ========== */
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: var(--z-background);
            background: 
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px),
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                radial-gradient(ellipse at top, #2d1b4e 0%, #1a0a2e 50%, #0a0e1a 100%);
            background-size: 50px 50px, 50px 50px, 100% 100%;
            background-position: 0 0, 0 0, center center;
        }

        #particles-js::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 212, 255, 0.03) 0px,
                transparent 2px,
                transparent 4px
            );
            pointer-events: none;
            animation: scan 8s linear infinite;
        }

        @keyframes scan {
            0% { transform: translateY(0); }
            100% { transform: translateY(50px); }
        }

        /* ========== Navbar ========== */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            z-index: var(--z-navbar);
            padding: var(--spacing-md) 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 14, 26, 0.4);
            backdrop-filter: blur(20px);
            border-bottom: 2px solid rgba(0, 212, 255, 0.2);
            box-shadow: 0 4px 30px rgba(0, 212, 255, 0.05);
            transition: all 0.3s ease;
        }

        .navbar.scrolled {
            padding: 15px 5%;
            background: rgba(10, 14, 26, 0.7);
            box-shadow: 0 4px 30px rgba(255, 0, 255, 0.1);
            border-bottom: 2px solid rgba(255, 0, 255, 0.3);
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .nav-menu {
            display: flex;
            gap: 40px;
            list-style: none;
            align-items: center;
        }

        .nav-menu a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
            position: relative;
        }

        .nav-menu a:hover, .nav-menu a.active {
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.8);
        }

        .nav-menu a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary-gradient);
            box-shadow: 0 0 8px rgba(0, 212, 255, 0.6);
            transition: width 0.3s;
        }

        .nav-menu a:hover::after, .nav-menu a.active::after {
            width: 100%;
        }

        .nav-buttons {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Language switcher */
        .lang-switcher {
            position: relative;
            margin-right: 16px;
        }
        
        .lang-btn {
            padding: 8px 16px;
            background: rgba(0, 196, 239, 0.1);
            border: 2px solid rgba(0, 196, 239, 0.3);
            border-radius: 20px;
            color: var(--neon-cyan);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            min-width: 50px;
        }
        
        .lang-btn:hover {
            background: rgba(0, 196, 239, 0.2);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 12px rgba(0, 196, 239, 0.4);
        }
        
        .lang-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 8px;
            background: rgba(10, 14, 26, 0.95);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(0, 196, 239, 0.3);
            border-radius: 12px;
            padding: 8px;
            min-width: 140px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s;
            z-index: 1000;
            box-shadow: 0 8px 24px rgba(0, 196, 239, 0.2);
        }
        
        .lang-switcher:hover .lang-dropdown {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        
        .lang-option {
            padding: 10px 12px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
            color: var(--text-secondary);
            font-weight: 500;
        }
        
        .lang-option:hover {
            background: rgba(0, 196, 239, 0.15);
            color: var(--neon-cyan);
        }
        
        .lang-option.active {
            background: rgba(0, 196, 239, 0.1);
            color: var(--neon-cyan);
        }

        .connect-btn {
            padding: 12px 30px;
            background: var(--primary-gradient);
            border: 2px solid transparent;
            border-radius: 25px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.5), 0 0 40px rgba(255, 0, 255, 0.3);
        }

        .connect-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 30px rgba(0, 212, 255, 0.7), 0 0 50px rgba(255, 0, 255, 0.5);
            border-color: rgba(255, 255, 255, 0.5);
        }

        /* ========== Hamburger Menu Button ========== */
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 10px;
            z-index: 1001;
        }

        .hamburger span {
            width: 25px;
            height: 3px;
            background: var(--primary-gradient);
            border-radius: 2px;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(8px, 8px);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(7px, -7px);
        }

        /* ========== Mobile Sidebar Menu ========== */
        .mobile-menu {
            position: fixed;
            top: 0;
            right: -100%;
            width: 280px;
            height: 100vh;
            background: rgba(10, 14, 26, 0.98);
            backdrop-filter: blur(20px);
            border-left: 2px solid rgba(0, 212, 255, 0.3);
            box-shadow: -4px 0 30px rgba(0, 212, 255, 0.2);
            padding: 80px 30px 30px;
            transition: right 0.4s ease;
            z-index: 999;
            overflow-y: auto;
        }

        .mobile-menu.active {
            right: 0;
        }

        .mobile-menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
            z-index: 998;
        }

        .mobile-menu-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .mobile-nav-links {
            list-style: none;
            margin-bottom: 30px;
        }

        .mobile-nav-links li {
            margin: 20px 0;
        }

        .mobile-nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            display: block;
            padding: 12px 0;
            border-bottom: 1px solid rgba(0, 212, 255, 0.1);
            transition: all 0.3s;
        }

        .mobile-nav-links a:hover, .mobile-nav-links a.active {
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.8);
            padding-left: 10px;
        }

        .mobile-connect-btn {
            width: 100%;
            margin-top: 30px;
            display: none;
        }

        .mobile-connect-btn {
            width: 100%;
            margin-top: 30px;
        }

        /* ========== Main Content Area ========== */
        .main-content {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 5% 50px;
        }

        .games-showcase {
            max-width: 1200px;
            width: 100%;
            text-align: center;
        }

        .showcase-title {
            font-size: 48px;
            font-weight: 900;
            margin-bottom: 60px;
            background: linear-gradient(135deg, #00d4ff 0%, #ffffff 30%, #ff00ff 70%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 30px rgba(0, 212, 255, 0.4));
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 40px;
            padding: 0 20px;
        }

        .game-card {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.05) 0%, rgba(255, 0, 255, 0.08) 100%);
            border: 2px solid rgba(0, 212, 255, 0.25);
            border-radius: 30px;
            padding: 50px 40px;
            text-align: center;
            transition: all 0.4s;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            text-decoration: none;
            display: block;
        }

        .game-card.with-poster {
            background-image: url('../images/hide-and-seek.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            padding: 50px 40px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            aspect-ratio: 1 / 1;
        }

        .game-card.with-poster::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.3) 50%, rgba(0, 0, 0, 0.85) 100%);
            z-index: 1;
            pointer-events: none;
        }

        .game-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 0, 255, 0.15) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .game-card:hover::before {
            opacity: 1;
            animation: rotate 8s linear infinite;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .game-card:hover {
            transform: translateY(-10px);
            border-color: var(--neon-pink);
            box-shadow: 0 20px 60px rgba(255, 0, 255, 0.4), 0 0 100px rgba(0, 212, 255, 0.3);
        }

        .game-card.available:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 20px 60px rgba(0, 212, 255, 0.5), 0 0 100px rgba(255, 0, 255, 0.3);
        }

        .game-card-icon {
            font-size: 100px;
            margin-bottom: 30px;
            display: inline-block;
            filter: drop-shadow(0 0 30px rgba(0, 212, 255, 0.6));
            position: relative;
            z-index: 1;
            animation: float 3s ease-in-out infinite;
        }

        .game-card.with-poster .game-card-icon {
            display: none;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .game-card:hover .game-card-icon {
            animation: float 1.5s ease-in-out infinite;
        }

        .game-card-title {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 15px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
            z-index: 1;
        }

        .game-card.with-poster .game-card-title {
            display: none;
        }

        .game-card-description {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 30px;
            line-height: 1.6;
            position: relative;
            z-index: 1;
        }

        .game-card.with-poster .game-card-description {
            font-size: 18px;
            color: white;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
            font-weight: 600;
            margin-bottom: 20px;
            position: relative;
            z-index: 2;
        }

        .game-card.with-poster .game-card-status {
            background: rgba(0, 212, 255, 0.85);
            color: #000;
            border: 2px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.8), 0 4px 15px rgba(0, 0, 0, 0.5);
            font-weight: 900;
            position: relative;
            z-index: 2;
        }

        .game-card-status {
            display: inline-block;
            padding: 10px 25px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }

        .game-card.available .game-card-status {
            background: rgba(0, 212, 255, 0.2);
            color: var(--neon-cyan);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { 
                transform: scale(1);
                box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
            }
            50% { 
                transform: scale(1.05);
                box-shadow: 0 0 30px rgba(0, 212, 255, 0.6);
            }
        }

        .game-card.coming-soon .game-card-status {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .game-card.coming-soon {
            cursor: default;
            opacity: 0.8;
        }

        .game-card.coming-soon:hover {
            transform: translateY(-5px);
        }


        /* ========== Responsive Design ========== */
        @media (max-width: 768px) {
            .nav-menu { display: none; }
            .lang-switcher { display: none; }
            .hamburger { display: flex; }
            .navbar .connect-btn { display: none; }
            .mobile-connect-btn { display: block; }
            
            .showcase-title {
                font-size: 36px;
            }
            
            .showcase-subtitle {
                font-size: 18px;
            }
            
            .games-grid {
                grid-template-columns: 1fr;
                gap: 30px;
            }
            
            .game-card {
                padding: 40px 30px;
            }
            
            .game-card-icon {
                font-size: 80px;
            }
            
            .game-card-title {
                font-size: 28px;
            }
            
            .game-card.with-poster {
                min-height: 300px;
                padding: 25px;
            }
            
            .game-card.with-poster .game-card-description {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- Particle background -->
    <div id="particles-js"></div>

    <!-- Navbar -->
    <nav class="navbar">
        <a href="index.html" class="logo">Debear Party</a>
        <ul class="nav-menu">
            <li><a href="index.html" data-i18n="nav.home">Home</a></li>
            <li><a href="swap.html" data-i18n="nav.swap">Swap</a></li>
            <li><a href="pass-nft.html" data-i18n="nav.pass">Pass NFT</a></li>
            <li><a href="t-engine.html" data-i18n="nav.tengine">T-Engine</a></li>
            <li><a href="gamefi.html" class="active" data-i18n="nav.gamefi">GameFi</a></li>
        </ul>
        <div class="nav-buttons">
            <!-- Language switcher -->
            <div class="lang-switcher">
                <button class="lang-btn">EN</button>
                <div class="lang-dropdown">
                    <div class="lang-option active" data-lang="en" onclick="window.i18n?.setLanguage('en')">
                        <span data-i18n="lang.en">English</span>
                    </div>
                    <div class="lang-option" data-lang="zh-TW" onclick="window.i18n?.setLanguage('zh-TW')">
                        <span data-i18n="lang.zh">繁體中文</span>
                    </div>
                </div>
            </div>
            <button class="connect-btn" onclick="connectWallet()" data-i18n="nav.connect">Connect Wallet</button>
            <button class="hamburger" onclick="toggleMobileMenu()">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <!-- Mobile menu overlay -->
    <div class="mobile-menu-overlay" onclick="toggleMobileMenu()"></div>

    <!-- Mobile sidebar menu -->
    <div class="mobile-menu">
        <ul class="mobile-nav-links">
            <li><a href="index.html" data-i18n="nav.home">Home</a></li>
            <li><a href="swap.html" data-i18n="nav.swap">Swap</a></li>
            <li><a href="pass-nft.html" data-i18n="nav.pass">Pass NFT</a></li>
            <li><a href="t-engine.html" data-i18n="nav.tengine">T-Engine</a></li>
            <li><a href="gamefi.html" class="active" data-i18n="nav.gamefi">GameFi</a></li>
        </ul>
        <!-- Mobile language selection -->
        <div style="margin-top: 20px; padding: 10px 0; border-top: 1px solid rgba(0, 212, 255, 0.2);">
            <div class="lang-option" style="padding: 12px; cursor: pointer;" data-lang="en" onclick="window.i18n?.setLanguage('en')">
                <span data-i18n="lang.en">English</span>
            </div>
            <div class="lang-option" style="padding: 12px; cursor: pointer;" data-lang="zh-TW" onclick="window.i18n?.setLanguage('zh-TW')">
                <span data-i18n="lang.zh">繁體中文</span>
            </div>
        </div>
        <button class="connect-btn mobile-connect-btn" onclick="connectWallet()" data-i18n="nav.connect">Connect Wallet</button>
    </div>


    <!-- Main content area -->
    <section class="main-content">
        <div class="games-showcase">
            <h1 class="showcase-title" data-i18n="gamefi.showcaseTitle">Play to Earn</h1>
            
            <div class="games-grid">
                <!-- Game 1: Available Game -->
                <a href="game-platform.html" class="game-card available with-poster">
                    <div class="game-card-icon">🎰</div>
                    <h2 class="game-card-title" data-i18n="gamefi.game1Title">Hide-and-seek</h2>
                    <p class="game-card-description" data-i18n="gamefi.game1Desc">夜色中生存,逃脱殺手的追击，赚取代币，体验快节奏的多人游戏！</p>
                    <span class="game-card-status" data-i18n="gamefi.playNow">Play Now</span>
                </a>

                <!-- Game 2: Coming Soon -->
                <div class="game-card coming-soon">
                    <div class="game-card-icon">🔮</div>
                    <h2 class="game-card-title" data-i18n="gamefi.game2Title">游戏正在开发中...</h2>
                    <p class="game-card-description" data-i18n="gamefi.game2Desc">敬请期待</p>
                    <span class="game-card-status" data-i18n="gamefi.comingSoon">Coming Soon</span>
                </div>
            </div>
        </div>
    </section>

    <!-- Particle effects library (本地化) -->
    <script src="js/libs/particles.min.js"></script>
    
    <!-- Internationalization config -->
    <script src="js/i18n.js"></script>
    
    <!-- Common scripts -->
    <script src="js/common.js"></script>
    
    <script>
        // ========== Particle background config ==========
        particlesJS('particles-js', {
            particles: {
                number: { value: 80, density: { enable: true, value_area: 800 } },
                color: { value: ['#00d4ff', '#ff00ff', '#4dd0e1', '#e91e63'] },
                shape: { type: 'circle' },
                opacity: { value: 0.6, random: true, anim: { enable: true, speed: 1, opacity_min: 0.2 } },
                size: { value: 3, random: true, anim: { enable: true, speed: 3, size_min: 0.5 } },
                line_linked: {
                    enable: true,
                    distance: 150,
                    color: '#00d4ff',
                    opacity: 0.3,
                    width: 1
                },
                move: {
                    enable: true,
                    speed: 1.5,
                    direction: 'none',
                    random: true,
                    straight: false,
                    out_mode: 'out',
                    bounce: false
                }
            },
            interactivity: {
                detect_on: 'canvas',
                events: {
                    onhover: { enable: true, mode: 'grab' },
                    onclick: { enable: true, mode: 'push' }
                },
                modes: {
                    grab: { distance: 200, line_linked: { opacity: 0.8 } },
                    push: { particles_nb: 4 }
                }
            }
        });

        // ========== Navbar scroll effect ==========
        window.addEventListener('scroll', () => {
            const navbar = document.querySelector('.navbar');
            if (window.scrollY > 100) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        // ========== Connect Wallet ==========
        async function connectWallet() {
            try {
                const walletProvider = window.okxwallet || window.ethereum;
                if (!walletProvider) {
                    const msg = window.i18n?.t('toast.wallet.noProvider') || 'Please install MetaMask or OKX Wallet!';
                    if (window.DebearParty?.toast) {
                        window.DebearParty.toast.error(msg);
                    } else {
                        alert(msg);
                    }
                    return;
                }

                await walletProvider.request({ method: 'eth_requestAccounts' });
                
                const chainId = await walletProvider.request({ method: 'eth_chainId' });
                const TARGET_CHAIN_ID = '0x138de';
                
                if (chainId !== TARGET_CHAIN_ID) {
                    try {
                        await walletProvider.request({
                            method: 'wallet_switchEthereumChain',
                            params: [{ chainId: TARGET_CHAIN_ID }]
                        });
                    } catch (switchError) {
                        // This error code indicates that the chain has not been added to MetaMask/OKX Wallet.
                        if (switchError.code === 4902) {
                            try {
                                await walletProvider.request({
                                    method: 'wallet_addEthereumChain',
                                    params: [{
                                        chainId: TARGET_CHAIN_ID,
                                        chainName: 'Berachain',
                                        nativeCurrency: {
                                            name: 'BERA',
                                            symbol: 'BERA',
                                            decimals: 18
                                        },
                                        rpcUrls: ['https://rpc.berachain.com'],
                                        blockExplorerUrls: ['https://beratrail.io']
                                    }],
                                });
                            } catch (addError) {
                                console.error('Add network failed:', addError);
                                const msg = window.i18n?.t('toast.wallet.addNetworkFailed') || 'Failed to add Berachain network automatically. Please add it manually.';
                                if (window.DebearParty?.toast) window.DebearParty.toast.error(msg);
                                else alert(msg);
                                return;
                            }
                        } else {
                            console.error('Switch network failed:', switchError);
                            const msg = window.i18n?.t('toast.wallet.switchNetwork') || 'Please switch to Berachain Mainnet (Chain ID: 80094)';
                            if (window.DebearParty?.toast) window.DebearParty.toast.error(msg);
                            else alert(msg);
                            return;
                        }
                    }
                }

                const accounts = await walletProvider.request({ method: 'eth_accounts' });
                const userAddress = accounts[0];
                
                const shortAddr = userAddress.substring(0, 6) + '...' + userAddress.substring(38);
                const connectBtns = document.querySelectorAll('.connect-btn');
                connectBtns.forEach(btn => {
                    btn.textContent = shortAddr;
                    btn.disabled = true;
                });
                
                localStorage.setItem('walletConnected', 'true');
                localStorage.setItem('walletAddress', userAddress);
                
                const successMsg = window.i18n?.t('toast.wallet.connected') || 'Wallet connected successfully!';
                if (window.DebearParty?.toast) {
                    window.DebearParty.toast.success(successMsg);
                } else {
                    alert(successMsg);
                }
            } catch (error) {
                console.error('Connect wallet error:', error);
                const errorMsg = (window.i18n?.t('toast.wallet.failed') || 'Failed to connect wallet') + ': ' + error.message;
                if (window.DebearParty?.toast) {
                    window.DebearParty.toast.error(errorMsg);
                } else {
                    alert(errorMsg);
                }
            }
        }

        // ========== Check and restore wallet connection ==========
        async function checkWalletConnection() {
            const wasConnected = localStorage.getItem('walletConnected');
            if (!wasConnected) return;

            try {
                const walletProvider = window.okxwallet || window.ethereum;
                if (!walletProvider) return;

                const accounts = await walletProvider.request({ method: 'eth_accounts' });
                if (accounts && accounts.length > 0) {
                    const userAddress = accounts[0];
                    const shortAddr = userAddress.substring(0, 6) + '...' + userAddress.substring(38);
                    const connectBtns = document.querySelectorAll('.connect-btn');
                    connectBtns.forEach(btn => {
                        btn.textContent = shortAddr;
                        btn.disabled = true;
                    });
                    localStorage.setItem('walletAddress', userAddress);
                } else {
                    localStorage.removeItem('walletConnected');
                    localStorage.removeItem('walletAddress');
                }
            } catch (error) {
                console.error('Error checking wallet connection:', error);
            }
        }

        // ========== Check wallet connection on page load ==========
        window.addEventListener('load', () => {
            checkWalletConnection();
        });

        // ========== Mobile menu toggle ==========
        function toggleMobileMenu() {
            const hamburger = document.querySelector('.hamburger');
            const mobileMenu = document.querySelector('.mobile-menu');
            const overlay = document.querySelector('.mobile-menu-overlay');
            
            hamburger.classList.toggle('active');
            mobileMenu.classList.toggle('active');
            overlay.classList.toggle('active');
            
            if (mobileMenu.classList.contains('active')) {
                document.body.style.overflow = 'hidden';
            } else {
                document.body.style.overflow = '';
            }
        }

    </script>
</body>
</html>
